name: SupplyChain-SQL-Agent CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build DataCo Supply Chain SQLite DB
        run: python data/load_supply_chain_data.py
      - name: Run unit & SQL guardrail tests
        run: python tests/test_agent_and_guardrails.py
      - name: Run 28-Question Benchmark Suite
        run: python eval/agent_benchmark.py
